<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Interface</title>
    <style>
        :root {
            --bg-color: #343541;
            --chat-bg: #444654;
            --user-msg-bg: #343541;
            --text-color: #ececf1;
            --input-bg: #40414f;
            --border-color: #565869;
            --accent-color: #10a37f;
            --accent-hover: #1a7f64;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header / API Key Section */
        header {
            background-color: #202123;
            padding: 10px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .api-container {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
        }

        input[type="password"] {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: white;
            padding: 8px 12px;
            border-radius: 4px;
            flex-grow: 1;
            max-width: 400px;
        }

        button.save-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }

        button.save-btn:hover {
            background-color: var(--accent-hover);
        }

        .status-msg {
            font-size: 0.9em;
            margin-left: 10px;
        }

        /* Chat Area */
        #chat-container {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            padding-bottom: 20px;
        }

        .message {
            padding: 24px;
            display: flex;
            gap: 20px;
            line-height: 1.6;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .message.ai {
            background-color: var(--chat-bg);
        }

        .message.user {
            background-color: var(--user-msg-bg);
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            flex-shrink: 0;
        }

        .avatar.ai { background-color: var(--accent-color); }
        .avatar.user { background-color: #5436DA; }

        .content {
            flex-grow: 1;
            overflow-wrap: break-word;
        }

        /* Input Area */
        .input-area {
            background-color: var(--bg-color);
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: center;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            max-width: 768px;
            display: flex;
            align-items: flex-end;
            background-color: var(--input-bg);
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            padding: 10px;
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            resize: none;
            max-height: 200px;
            padding: 4px;
            outline: none;
            font-size: 1rem;
            line-height: 1.5;
        }

        button.send-btn {
            background-color: transparent;
            color: var(--text-color);
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.send-btn:hover {
            background-color: #2A2B32;
        }

        button.send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Loading Indicator */
        .typing-indicator span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: #b1b1b1;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out both;
            margin-right: 2px;
        }
        
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Markdown-like styling for code blocks (Simple) */
        pre {
            background-color: black;
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            margin-top: 10px;
        }
        code {
            font-family: 'Courier New', Courier, monospace;
        }
    </style>
</head>
<body>

    <header>
        <div class="api-container">
            <label for="api-key">OpenAI API Key:</label>
            <!-- Masukkan key kamu di sini -->
            <input type="password" id="api-key" placeholder="sk-...">
            <button class="save-btn" onclick="saveApiKey()">Simpan Key</button>
            <span id="status" class="status-msg"></span>
        </div>
        <div style="font-size: 0.9em; opacity: 0.7;">
            Key disimpan di LocalStorage browser kamu.
        </div>
    </header>

    <div id="chat-container">
        <div class="message ai">
            <div class="avatar ai">AI</div>
            <div class="content">Halo! Silakan masukkan API Key OpenAI kamu di kolom atas, lalu kita bisa mulai berbicara.</div>
        </div>
    </div>

    <div class="input-area">
        <div class="input-wrapper">
            <textarea id="user-input" rows="1" placeholder="Kirim pesan..." oninput="autoResize(this)"></textarea>
            <button id="send-btn" class="send-btn" onclick="sendMessage()">
                <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="16" width="16" xmlns="http://www.w3.org/2000/svg"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const apiKeyInput = document.getElementById('api-key');
        const statusMsg = document.getElementById('status');
        let messageHistory = [];

        // Load API Key from LocalStorage if exists
        window.onload = () => {
            const savedKey = localStorage.getItem('openai_api_key');
            if (savedKey) {
                apiKeyInput.value = savedKey;
                statusMsg.textContent = "Key tersimpan.";
                statusMsg.style.color = "#10a37f";
            }
        };

        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            if (key.startsWith('sk-')) {
                localStorage.setItem('openai_api_key', key);
                statusMsg.textContent = "Key berhasil disimpan!";
                statusMsg.style.color = "#10a37f";
            } else {
                statusMsg.textContent = "Format key sepertinya salah.";
                statusMsg.style.color = "#ff6b6b";
            }
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
            if(textarea.value === '') textarea.style.height = 'auto';
        }

        function appendMessage(role, text) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;
            
            const avatarDiv = document.createElement('div');
            avatarDiv.className = `avatar ${role}`;
            avatarDiv.innerText = role === 'user' ? 'U' : 'AI';

            const contentDiv = document.createElement('div');
            contentDiv.className = 'content';
            
            // Simple formatting for newlines and basic code blocks
            let formattedText = text
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>') // Code blocks
                .replace(/\n/g, '<br>'); // Line breaks

            contentDiv.innerHTML = formattedText;

            msgDiv.appendChild(avatarDiv);
            msgDiv.appendChild(contentDiv);
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            return contentDiv; // Return for streaming updates
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            const apiKey = localStorage.getItem('openai_api_key');

            if (!text) return;
            if (!apiKey) {
                alert("Mohon masukkan API Key terlebih dahulu!");
                apiKeyInput.focus();
                return;
            }

            // UI Updates
            userInput.value = '';
            userInput.style.height = 'auto';
            sendBtn.disabled = true;
            
            // Add User Message
            appendMessage('user', text);
            messageHistory.push({ role: "user", content: text });

            // Create Loading Placeholder
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai';
            loadingDiv.innerHTML = `<div class="avatar ai">AI</div><div class="content typing-indicator"><span></span><span></span><span></span></div>`;
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // Call OpenAI API
                const response = await fetch('https://api.openai.com/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${apiKey}`
                    },
                    body: JSON.stringify({
                        model: "gpt-3.5-turbo", // atau "gpt-4" jika aksesnya ada
                        messages: messageHistory
                    })
                });

                const data = await response.json();

                // Remove loading indicator
                chatContainer.removeChild(loadingDiv);

                if (response.ok) {
                    const aiReply = data.choices[0].message.content;
                    messageHistory.push({ role: "assistant", content: aiReply });
                    appendMessage('ai', aiReply);
                } else {
                    appendMessage('ai', `Error: ${data.error?.message || 'Terjadi kesalahan.'}`);
                }

            } catch (error) {
                chatContainer.removeChild(loadingDiv);
                appendMessage('ai', `Error: Gagal terhubung ke server.`);
                console.error(error);
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        // Enter key to send (Shift+Enter for new line)
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
  </html>
