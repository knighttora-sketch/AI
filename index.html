<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Opus (Tokies)</title>
    <style>
        body { 
            background-color: #1a1a1a; 
            color: #e0e0e0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            margin: 0; 
        }

        /* HEADER / CONFIG */
        #config-bar {
            background-color: #2d2d2d;
            padding: 15px;
            border-bottom: 1px solid #444;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .input-group { display: flex; flex-direction: column; }
        label { font-size: 0.75rem; color: #aaa; margin-bottom: 4px; }
        
        input, select {
            background-color: #383838;
            border: 1px solid #555;
            color: white;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        
        input:focus { outline: 1px solid #d97757; }

        /* CHAT AREA */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            gap: 15px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            animation: fadeIn 0.3s ease;
        }

        .avatar {
            width: 32px; height: 32px;
            border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 14px;
            flex-shrink: 0;
        }

        .avatar.ai { background-color: #d97757; color: white; }
        .avatar.user { background-color: #5436da; color: white; }

        .content {
            line-height: 1.6;
            font-size: 1rem;
            overflow-wrap: break-word;
        }

        .message.user { flex-direction: row-reverse; }
        .message.user .content { 
            background-color: #3d3d3d; 
            padding: 10px 15px; 
            border-radius: 12px;
            border-top-right-radius: 2px;
        }
        
        .message.ai .content {
            padding-top: 5px; /* Align avatar with text */
        }

        pre { background: #111; padding: 15px; border-radius: 6px; overflow-x: auto; margin-top: 10px; border: 1px solid #333; }
        code { font-family: 'Courier New', monospace; color: #ccc; }

        /* INPUT AREA */
        #input-area {
            background-color: #1a1a1a;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .input-box {
            position: relative;
            width: 100%;
            max-width: 900px;
            background-color: #383838;
            border-radius: 12px;
            border: 1px solid #555;
            display: flex;
            align-items: flex-end;
            padding: 10px;
        }

        .input-box:focus-within { border-color: #777; }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: white;
            resize: none;
            max-height: 200px;
            padding: 5px;
            outline: none;
            font-family: inherit;
            line-height: 1.5;
        }

        button.send-btn {
            background-color: #d97757;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 10px;
            transition: background 0.2s;
        }
        button.send-btn:hover { background-color: #b86245; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="config-bar">
        <div class="input-group">
            <label>Base URL (Tokies)</label>
            <input type="text" id="base-url" value="https://api.tokies.lol/anthropic">
        </div>
        <div class="input-group">
            <label>API Key</label>
            <!-- Key pre-filled based on your request -->
            <input type="password" id="api-key" value="sk-ant-api03-66PvcUF5zHhwnbLa28hiL5tONUVXKlcdHENk09fPFZYyGjFgMCAAWFWTvEADLrx2QnVzcJPNiTLYuGXFCE4B-iMiGw7k_AA">
        </div>
        <div class="input-group">
            <label>Model</label>
            <select id="model-select">
                <option value="claude-opus-4-8" selected>Claude Opus 4.8 (Fastest/Smartest)</option>
                <option value="claude-sonnet-4-6">Claude Sonnet 4.6</option>
                <option value="claude-haiku-4-5">Claude Haiku 4.5 (Cheapest)</option>
            </select>
        </div>
        <div class="input-group" style="justify-content: flex-end;">
            <button onclick="clearChat()" style="background:#444; margin-top:18px;">Clear Chat</button>
        </div>
    </div>

    <div id="chat-container">
        <div class="message ai">
            <div class="avatar ai">C</div>
            <div class="content">
                Hello! I am connected via <b>Tokies.lol</b> using the <b>Claude Opus 4.8</b> model. How can I help you today?
            </div>
        </div>
    </div>

    <div id="input-area">
        <div class="input-box">
            <textarea id="user-input" rows="1" placeholder="Send a message to Claude..." oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        let messages = []; // Store conversation history

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            
            const avatar = document.createElement('div');
            avatar.className = `avatar ${role}`;
            avatar.innerText = role === 'user' ? 'U' : 'C';

            const content = document.createElement('div');
            content.className = 'content';
            
            // Simple formatting
            let formatted = text
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                .replace(/\n/g, '<br>');
            
            content.innerHTML = formatted;

            div.appendChild(avatar);
            div.appendChild(content);
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function clearChat() {
            messages = [];
            chatContainer.innerHTML = '';
            appendMessage('ai', 'Chat history cleared. Ready for a new topic.');
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            const baseUrl = document.getElementById('base-url').value.replace(/\/$/, ''); // Remove trailing slash
            const apiKey = document.getElementById('api-key').value;
            const model = document.getElementById('model-select').value;

            if (!text) return;
            if (!apiKey) return alert("Please enter API Key");

            // UI Update
            userInput.value = '';
            userInput.style.height = 'auto';
            appendMessage('user', text);
            messages.push({ role: "user", content: text });

            // Loading Indicator
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message ai';
            loadingDiv.innerHTML = `<div class="avatar ai">C</div><div class="content">Thinking...</div>`;
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // NOTE: Tokies acts as a proxy. We send standard Anthropic format,
                // but the URL points to Tokies.
                const response = await fetch(`${baseUrl}/v1/messages`, {
                    method: 'POST',
                    headers: {
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01',
                        'content-type': 'application/json',
                        'dangerously-allow-browser': 'true'
                    },
                    body: JSON.stringify({
                        model: model,
                        max_tokens: 4096,
                        messages: messages
                    })
                });

                const data = await response.json();
                chatContainer.removeChild(loadingDiv);

                if (response.ok && data.content) {
                    const reply = data.content[0].text;
                    messages.push({ role: "assistant", content: reply });
                    appendMessage('ai', reply);
                } else {
                    console.error(data);
                    appendMessage('ai', `<span style="color:#ff6b6b">Error: ${data.error?.message || JSON.stringify(data)}</span>`);
                }

            } catch (error) {
                chatContainer.removeChild(loadingDiv);
                appendMessage('ai', `<span style="color:#ff6b6b">Network Error: ${error.message}<br>Check if the Base URL is correct.</span>`);
                console.error(error);
            }
        }

        // Enter key to send
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
