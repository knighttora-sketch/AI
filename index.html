<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Opus (Tokies Fixed)</title>
    <style>
        body { 
            background-color: #1a1a1a; 
            color: #e0e0e0; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            margin: 0; 
        }

        /* HEADER */
        #config-bar {
            background-color: #252526;
            padding: 10px 20px;
            border-bottom: 1px solid #3e3e42;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            align-items: end;
        }

        .input-group { display: flex; flex-direction: column; }
        label { font-size: 0.75rem; color: #858585; margin-bottom: 5px; font-weight: bold; text-transform: uppercase; }
        
        input, select {
            background-color: #3c3c3c;
            border: 1px solid #3c3c3c;
            color: #cccccc;
            padding: 8px;
            border-radius: 2px;
            font-size: 0.9rem;
            font-family: inherit;
        }
        
        input:focus, select:focus { outline: 1px solid #007acc; border-color: #007acc; }

        /* CHAT */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #1e1e1e;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        .avatar {
            width: 30px; height: 30px;
            border-radius: 2px;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: bold;
            flex-shrink: 0;
            color: white;
        }

        .avatar.ai { background-color: #da552f; } /* Claude Orange */
        .avatar.user { background-color: #007acc; } /* VS Code Blue */

        .content { line-height: 1.5; font-size: 0.95rem; padding-top: 2px; white-space: pre-wrap; }

        .message.user { flex-direction: row-reverse; }
        .message.user .content { 
            text-align: right; 
            color: #9cdcfe; 
        }
        
        pre { 
            background: #101010; 
            padding: 10px; 
            border-radius: 4px; 
            border: 1px solid #333; 
            overflow-x: auto; 
            margin: 10px 0; 
        }
        code { font-family: 'Consolas', monospace; color: #dcdcaa; }

        /* INPUT */
        #input-area {
            background-color: #252526;
            padding: 15px;
            border-top: 1px solid #3e3e42;
        }

        .input-wrapper {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 10px;
            background: #3c3c3c;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #3c3c3c;
        }
        .input-wrapper:focus-within { border-color: #007acc; }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            resize: none;
            max-height: 150px;
            outline: none;
            font-family: inherit;
        }

        button.send-btn {
            background-color: #0e639c;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        button.send-btn:hover { background-color: #1177bb; }
        button.send-btn:disabled { background-color: #555; cursor: not-allowed; }

        /* ERROR HIGHLIGHT */
        .error-text { color: #f48771; }
    </style>
</head>
<body>

    <div id="config-bar">
        <div class="input-group">
            <label>Base URL</label>
            <!-- Added /v1 at the end automatically to be safe -->
            <input type="text" id="base-url" value="https://api.tokies.lol/anthropic/v1">
        </div>
        <div class="input-group">
            <label>API Key</label>
            <input type="password" id="api-key" value="sk-ant-api03-66PvcUF5zHhwnbLa28hiL5tONUVXKlcdHENk09fPFZYyGjFgMCAAWFWTvEADLrx2QnVzcJPNiTLYuGXFCE4B-iMiGw7k_AA">
        </div>
        <div class="input-group">
            <label>Model</label>
            <select id="model-select">
                <option value="claude-opus-4-8" selected>Claude Opus 4.8</option>
                <option value="claude-sonnet-4-6">Claude Sonnet 4.6</option>
                <option value="claude-haiku-4-5">Claude Haiku 4.5</option>
            </select>
        </div>
    </div>

    <div id="chat-container"></div>

    <div id="input-area">
        <div class="input-wrapper">
            <textarea id="user-input" rows="1" placeholder="Type a message..."></textarea>
            <button id="send-btn" class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        let messages = [];

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            
            const avatar = document.createElement('div');
            avatar.className = `avatar ${role}`;
            avatar.innerText = role === 'user' ? 'U' : 'C';

            const content = document.createElement('div');
            content.className = 'content';
            
            // Basic Markdown handling
            let formatted = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>');
            
            content.innerHTML = formatted;

            div.appendChild(avatar);
            div.appendChild(content);
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            const baseUrl = document.getElementById('base-url').value.replace(/\/$/, ''); // Remove trailing slash if any
            const apiKey = document.getElementById('api-key').value;
            const model = document.getElementById('model-select').value;

            if (!text) return;
            
            // UI
            userInput.value = '';
            userInput.style.height = 'auto';
            appendMessage('user', text);
            messages.push({ role: "user", content: text });
            sendBtn.disabled = true;

            // Loading
            const loadingId = 'loading-' + Date.now();
            const loadingHTML = `<div id="${loadingId}" class="message ai"><div class="avatar ai">C</div><div class="content">Thinking...</div></div>`;
            chatContainer.insertAdjacentHTML('beforeend', loadingHTML);
            const loadingEl = document.getElementById(loadingId);

            try {
                // Construct URL: BaseURL + /messages
                // If your base URL is https://api.tokies.lol/anthropic/v1, we append /messages
                // If it is https://api.tokies.lol/anthropic, we append /v1/messages
                let endpoint = baseUrl;
                
                // Smart path appending
                if (!endpoint.includes('/v1')) {
                    endpoint += '/v1';
                }
                endpoint += '/messages';

                console.log("Fetching:", endpoint); // Check console for URL

                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: {
                        'x-api-key': apiKey,
                        'anthropic-version': '2023-06-01',
                        'content-type': 'application/json',
                        'dangerously-allow-browser': 'true'
                    },
                    body: JSON.stringify({
                        model: model,
                        max_tokens: 4096,
                        messages: messages
                    })
                });

                const data = await response.json();
                loadingEl.remove();

                if (response.ok) {
                    const reply = data.content[0].text;
                    messages.push({ role: "assistant", content: reply });
                    appendMessage('ai', reply);
                } else {
                    console.error("API Error:", data);
                    let errorMsg = data.error?.message || JSON.stringify(data);
                    appendMessage('ai', `<span class="error-text">Error: ${errorMsg}</span>`);
                }

            } catch (error) {
                loadingEl.remove();
                console.error("Network Error:", error);
                appendMessage('ai', `<span class="error-text">Network Error: ${error.message}.\n\nPossible Cause: CORS (Cross-Origin) block.\nTry disabling 'Web Security' in your browser temporarily if this persists.</span>`);
            } finally {
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        // Auto-resize textarea
        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });

        // Enter to send
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>
</html>
