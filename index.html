<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Account Manager - FIXED</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --primary: #00a8ff;
            --success: #2ecc71;
            --error: #e74c3c;
            --warning: #f1c40f;
            --border: #333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }
        
        header { text-align: center; padding: 20px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; }
        h1 { color: var(--primary); margin-bottom: 5px; }
        .subtitle { color: var(--text-muted); font-size: 0.9rem; }

        .tabs { display: flex; background: var(--card-bg); border-radius: 12px; padding: 5px; gap: 5px; }
        .tab-btn { flex: 1; padding: 12px; background: transparent; border: none; color: var(--text-muted); cursor: pointer; border-radius: 8px; font-weight: 600; }
        .tab-btn.active { background: var(--primary); color: #fff; }

        .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: none; animation: fadeIn 0.3s; }
        .panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        input[type="text"], textarea { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid var(--border); border-radius: 8px; color: #fff; margin-bottom: 10px; font-family: monospace;}
        
        .btn { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; color: #fff; background: var(--primary); }
        .btn:hover { opacity: 0.9; }
        
        .file-upload { border: 2px dashed var(--border); padding: 20px; text-align: center; border-radius: 8px; cursor: pointer; }
        .file-upload:hover { border-color: var(--primary); background: rgba(0,168,255,0.05); }

        .results-list { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .account-card { background: #252525; padding: 15px; border-radius: 8px; border-left: 4px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .account-card.valid { border-left-color: var(--success); }
        .account-card.invalid { border-left-color: var(--error); }
        
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
        .status-badge.valid { background: rgba(46, 204, 113, 0.2); color: var(--success); }
        .status-badge.invalid { background: rgba(231, 76, 60, 0.2); color: var(--error); }
        .status-badge.checking { background: rgba(241, 196, 15, 0.2); color: var(--warning); }

        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 12px 24px; border-radius: 8px; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 1000; }
        #toast.show { opacity: 1; bottom: 40px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🤖 Roblox Manager (Fixed)</h1>
        <div class="subtitle">Auto-clean WARNING tags | Proxy Support</div>
    </header>

    <nav class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab-scan')">🔍 Scan File</button>
        <button class="tab-btn" onclick="switchTab('tab-manual')">🔐 Manual</button>
        <button class="tab-btn" onclick="switchTab('tab-results')">📊 Results</button>
    </nav>

    <!-- TAB 1: SCAN -->
    <div id="tab-scan" class="panel active">
        <label>Select Cookies.txt</label>
        <div class="file-upload" onclick="document.getElementById('fileInput').click()">
            <p>Click to Select File</p>
            <input type="file" id="fileInput" accept=".txt" hidden onchange="handleFileUpload(this)">
        </div>
        <div id="scan-status" style="margin-top: 10px; color: var(--text-muted);"></div>
    </div>

    <!-- TAB 2: MANUAL -->
    <div id="tab-manual" class="panel">
        <label>Cookie</label>
        <textarea id="manual-cookie" rows="5" placeholder="Paste full cookie string including WARNING tags..."></textarea>
        <button class="btn" onclick="checkManual()">Check Cookie</button>
    </div>

    <!-- TAB 3: RESULTS -->
    <div id="tab-results" class="panel">
        <div style="display:flex; justify-content:space-between;">
            <h3>Results</h3>
            <button class="btn" style="background:#444; font-size:0.8rem;" onclick="exportData()">Download JSON</button>
        </div>
        <div class="results-list" id="accounts-list"></div>
    </div>
</div>

<div id="toast">Message</div>

<script>
    let accounts = [];

    // --- PROXY LIST (Fallbacks) ---
    const PROXIES = [
        "https://corsproxy.io/?",
        "https://api.allorigins.win/raw?url="
    ];

    function switchTab(id) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'tab-results') renderAccounts();
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    // --- COOKIE CLEANER (FIXES THE WARNING ERROR) ---
    function cleanCookie(value) {
        // Remove WARNING prefix exactly like the Python script
        if (value.includes('WARNING')) {
            return value.split('|_|WARNING')[0].trim();
        }
        return value.trim();
    }

    // --- PARSER ---
    function parseCookies(content) {
        const lines = content.split('\n');
        const cookies = [];

        lines.forEach((line, index) => {
            line = line.trim();
            if (!line || (line.startsWith('#') && !line.startsWith('#HttpOnly'))) return;

            // Handle #HttpOnly prefix
            let processedLine = line;
            if (line.startsWith('#HttpOnly')) processedLine = line.substring(9);

            const parts = processedLine.split('\t');

            if (parts.length === 7) {
                const [domain, includeSubdomains, path, isSecure, expiry, name, value] = parts;

                // Check for the cookie name
                if (name === '.ROBLOSECURITY') {
                    const cleanedValue = cleanCookie(value);
                    
                    if (cleanedValue.length > 50) {
                        cookies.push({
                            domain: domain,
                            value: cleanedValue,
                            line: index + 1
                        });
                    }
                }
            }
        });
        return cookies;
    }

    // --- VALIDATOR WITH PROXY FALLBACK ---
    async function validateCookie(cookie) {
        const targetUrl = "https://users.roblox.com/v1/users/authenticated";
        
        // Try proxies sequentially
        for (const proxy of PROXIES) {
            try {
                const finalUrl = proxy + encodeURIComponent(targetUrl);
                
                const response = await fetch(finalUrl, {
                    method: 'GET',
                    headers: {
                        'Cookie': `.ROBLOSECURITY=${cookie}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data && data.id) return { valid: true, data: data };
                }
            } catch (e) {
                console.log(`Proxy ${proxy} failed, trying next...`);
                continue; // Try next proxy
            }
        }

        return { valid: false, data: null };
    }

    // --- FILE HANDLING ---
    async function handleFileUpload(input) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (e) => {
            const content = e.target.result;
            const cookies = parseCookies(content);
            
            document.getElementById('scan-status').textContent = `Found ${cookies.length} cookies. Processing...`;

            if (cookies.length === 0) {
                showToast("No valid cookies found in file.");
                return;
            }

            for (const c of cookies) {
                // Add to list as checking
                addAccountToList({ username: "Checking...", displayName: "Scanning", userId: "???", cookie: c.value, status: 'checking', domain: c.domain });
                
                // Validate
                const result = await validateCookie(c.value);
                
                if (result.valid) {
                    updateLastAccount({ 
                        username: result.data.name, 
                        displayName: result.data.displayName, 
                        userId: result.data.id, 
                        cookie: c.value, 
                        status: 'valid', 
                        domain: c.domain 
                    });
                } else {
                    updateLastAccount({ 
                        username: "Unknown", 
                        displayName: "Invalid / Dead", 
                        userId: "N/A", 
                        cookie: c.value, 
                        status: 'invalid', 
                        domain: c.domain 
                    });
                }
                // Small delay
                await new Promise(r => setTimeout(r, 800)); 
            }
            showToast("Scan Complete!");
            switchTab('tab-results');
        };
        reader.readAsText(file);
    }

    // --- MANUAL CHECK ---
    async function checkManual() {
        let cookie = document.getElementById('manual-cookie').value.trim();
        if (!cookie) return showToast("Enter a cookie");

        // Clean the manual entry too
        cookie = cleanCookie(cookie);

        addAccountToList({ username: "Manual", displayName: "Validating...", userId: "...", cookie: cookie, status: 'checking', domain: "Manual" });
        
        const result = await validateCookie(cookie);
        
        if (result.valid) {
            updateLastAccount({ username: result.data.name, displayName: result.data.displayName, userId: result.data.id, cookie: cookie, status: 'valid', domain: "Manual" });
        } else {
            updateLastAccount({ username: "Unknown", displayName: "Invalid", userId: "N/A", cookie: cookie, status: 'invalid', domain: "Manual" });
        }
    }

    // --- UI HELPERS ---
    function addAccountToList(acc) {
        accounts.push(acc);
        renderAccounts();
    }

    function updateLastAccount(acc) {
        if (accounts.length > 0) {
            accounts[accounts.length - 1] = acc;
            renderAccounts();
        }
    }

    function renderAccounts() {
        const list = document.getElementById('accounts-list');
        list.innerHTML = '';
        
        [...accounts].reverse().forEach(acc => {
            const div = document.createElement('div');
            div.className = `account-card ${acc.status}`;
            div.innerHTML = `
                <div>
                    <strong style="color:var(--text-main)">${acc.displayName}</strong> 
                    <span style="font-size:0.8em; color:var(--text-muted)">(${acc.username})</span>
                    <div style="font-size:0.75em; color:#666; margin-top:4px;">ID: ${acc.userId} | Domain: ${acc.domain}</div>
                    <div style="font-size:0.7em; color:#444; font-family:monospace;">${acc.cookie.substring(0, 25)}...</div>
                </div>
                <div class="status-badge ${acc.status}">${acc.status.toUpperCase()}</div>
            `;
            list.appendChild(div);
        });
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(accounts, null, 2));
        const a = document.createElement('a');
        a.href = dataStr;
        a.download = "roblox_results.json";
        a.click();
    }
</script>

</body>
</html>
